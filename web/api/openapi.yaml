# The pinled device API, as shipped. Generated by hand from api.h (the
# authoritative endpoint table) and the handlers in api.cpp — when this
# file and the firmware disagree, the firmware is right and this file has
# a bug. kApiVersion tracks the CONTRACT: it changes when an endpoint or a
# status code changes meaning, not when fields are added (protobuf handles
# additive change without ceremony).
openapi: 3.0.3
info:
  title: pinled device API
  version: "1"
  description: |
    The HTTP API every pinled controller serves on its LAN address
    (`/api/v1`, API version **1**).

    **Every body is protobuf** (`application/x-protobuf`), encoded against
    [`proto/pinled.proto`](https://github.com/jeffersonjhunt/pinled) — the
    firmware contains no JSON parser (FR-CFG-13). That is why "try it out"
    is disabled in this viewer: a hand-typed JSON body cannot be valid.
    `tools/pbtool.py` is the curl equivalent; the SPA's `js/api.js` is the
    browser client.

    **Unauthenticated, CORS wide open** (FR-UI-3), deliberately: the
    standalone app runs from `file://` (origin `null`) and nothing on the
    device is a secret. The one dangerous direction — booting uploaded
    firmware — is gated by a physical button press instead (FR-OTA-2), so
    the API can only stage and discard.

    **Writes restart the device** where noted (FR-CFG-16): the response is
    flushed first, then the restart follows on a timer. A dropped
    connection right after a 200 on those endpoints is the success path.
servers:
  - url: http://pinled.local
    description: mDNS name (where .local resolution works)
  - url: http://192.168.0.0
    description: the numeric address the setup page reported (edit to yours)
tags:
  - name: identity
  - name: configuration
  - name: live
  - name: profiler
  - name: provisioning
  - name: firmware
  - name: bench

components:
  schemas:
    Protobuf:
      type: string
      format: binary
      description: A protobuf-encoded message; see the named message type.
  responses:
    ApplyResult:
      description: "`pinled.v1.ApplyResult`: accepted, restarted, message."
      content:
        application/x-protobuf:
          schema: { $ref: "#/components/schemas/Protobuf" }

paths:
  /api/v1/info:
    get:
      tags: [identity]
      summary: Who and what this device is
      description: |
        `pinled.v1.DeviceInfo`: API version (the contract this file
        documents), firmware version, per-build `build_id` (ELF-hash
        prefix — the truthful build identity), eFuse-derived `device_id`
        (FR-REG-1), stored author handle, channel/LED geometry,
        `running_slot` (`ota_0`/`ota_1`), and the OTA confirmation window
        (`ota_pending`, `ota_confirm_seconds_left`, rounded up so 1 ms
        left never reads as 0).
      responses:
        "200":
          description: "`pinled.v1.DeviceInfo`"
          content:
            application/x-protobuf:
              schema: { $ref: "#/components/schemas/Protobuf" }

  /api/v1/config:
    get:
      tags: [configuration]
      summary: The stored install config, byte-for-byte
      description: |
        Returns the stored `pinled.v1.InstallConfig` **verbatim** — CRC
        checked, never re-encoded, so fields written by a newer client
        survive round trips (FR-UI-4). An unconfigured device synthesises
        a document from its running configuration instead.
      responses:
        "200":
          description: "`pinled.v1.InstallConfig` (stored bytes, or synthesised when nothing is stored)"
          content:
            application/x-protobuf:
              schema: { $ref: "#/components/schemas/Protobuf" }
    put:
      tags: [configuration]
      summary: Store an install config, then restart
      description: |
        Body is `pinled.v1.InstallConfig`. Validated by `resolve()` —
        lenient where a half-finished install is normal, strict where a
        value is ambiguous or impossible (duplicate channels, out-of-range
        indices and values are refused). **Restarts on success.**
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { $ref: "#/components/schemas/Protobuf" }
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "400": { description: Not a valid document, too large, or refused by resolve() (the reason is in the body) }
        "408": { description: Body never arrived }
        "500": { description: Store write failed }
    delete:
      tags: [configuration]
      summary: Revert to build defaults, then restart
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "500": { description: Erase failed }

  /api/v1/profile:
    get:
      tags: [configuration]
      summary: The stored machine profile, byte-for-byte
      description: |
        `pinled.v1.MachineProfile`, verbatim like `/config`. An
        unconfigured device returns an **empty** profile — "no lamps are
        styled" is the truth, and inventing entries would not be.
      responses:
        "200":
          description: "`pinled.v1.MachineProfile` (may be empty)"
          content:
            application/x-protobuf:
              schema: { $ref: "#/components/schemas/Protobuf" }
    put:
      tags: [configuration]
      summary: Store a machine profile, then restart
      description: |
        Body is `pinled.v1.MachineProfile`. Partial application is by
        design (WEBUI §8.2): entries for unwired lamps are ignored, wired
        lamps without entries stay unstyled, and the UI reports the
        shortfall rather than anything blocking here.
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { $ref: "#/components/schemas/Protobuf" }
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "400": { description: Not a valid document or too large }
        "408": { description: Body never arrived }
        "500": { description: Store write failed }
    delete:
      tags: [configuration]
      summary: Revert to unstyled, then restart
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "500": { description: Erase failed }

  /api/v1/live:
    get:
      tags: [live]
      summary: "WebSocket: live per-channel state at ~30 Hz"
      description: |
        Upgrades to a WebSocket carrying binary `pinled.v1.LiveFrame`
        messages (FR-UI-5): `seq`, `channel_count`, and a packed `samples`
        payload of **2 bytes per channel** — `[0]` reconstructed level
        0..255, `[1]` flags (bit0 = active since last push, sticky and
        cleared on send, so no flash is ever missed at any push rate;
        bit1 = bound to a lamp; bits 2..4 = DriveClass as classified).
        Frames are dropped rather than ever stalling the scan (FR-UI-9);
        the sticky bit makes a dropped frame lossless. At most 3
        concurrent clients; a refused upgrade closes the socket.
      responses:
        "101": { description: Switching to WebSocket }

  /api/v1/profiler:
    get:
      tags: [profiler]
      summary: Drive-scheme classifier status
      responses:
        "200":
          description: "`pinled.v1.ProfilerStatus` (state UNAVAILABLE on builds with no scan task)"
          content:
            application/x-protobuf:
              schema: { $ref: "#/components/schemas/Protobuf" }
    post:
      tags: [profiler]
      summary: Re-arm a classification pass
      description: |
        No body. Equivalent to the short button press when nothing is
        staged (FR-PROF-2). The response is the status the caller then
        watches.
      responses:
        "200":
          description: "`pinled.v1.ProfilerStatus` — pass requested"
          content:
            application/x-protobuf:
              schema: { $ref: "#/components/schemas/Protobuf" }
        "409":
          description: A pass is already running (`pinled.v1.ProfilerStatus` in the body)

  /api/v1/scan:
    get:
      tags: [provisioning]
      summary: Visible Wi-Fi networks
      description: |
        `pinled.v1.ScanResult`. In SoftAP (setup) mode this serves the
        list cached at boot — scanning on demand would hop channels and
        disconnect the phone that asked.
      responses:
        "200":
          description: "`pinled.v1.ScanResult`"
          content:
            application/x-protobuf:
              schema: { $ref: "#/components/schemas/Protobuf" }
        "500": { description: Out of memory }

  /api/v1/provision:
    post:
      tags: [provisioning]
      summary: Store Wi-Fi credentials, then restart to join
      description: |
        Body is `pinled.v1.WifiCredentials` (FR-CFG-12: credentials live
        in NVS only and appear in **no** exported document — InstallConfig
        has no credential field on purpose). **Restarts on success.**
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { $ref: "#/components/schemas/Protobuf" }
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "400": { description: Implausible body, invalid credentials, or empty SSID }
        "408": { description: Body never arrived }
        "500": { description: Could not store }
    delete:
      tags: [provisioning]
      summary: Forget the network, restart into the setup portal
      description: The same outcome as the 5-second button hold (FR-UI-7).
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "500": { description: Could not erase }

  /api/v1/author:
    put:
      tags: [identity]
      summary: Store the author handle
      description: |
        Body is `pinled.v1.AuthorHandle` (FR-REG-1): 1–31 bytes, no
        control bytes, no leading/trailing space; UTF-8 passes through.
        Attribution only — nothing running reads it, so **no restart**.
        The SPA stamps it into exported profiles; ownership and
        verification are cloud-side concerns.
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { $ref: "#/components/schemas/Protobuf" }
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "400": { description: Not an AuthorHandle, or the handle fails the rule (detail in the body) }
        "500": { description: NVS store failed }
    delete:
      tags: [identity]
      summary: Clear the author handle
      description: Idempotent — clearing a device that never had one is a 200.
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "500": { description: NVS erase failed }

  /api/v1/ota:
    post:
      tags: [firmware]
      summary: Stage a firmware image (the button decides the rest)
      description: |
        Raw image bytes (`application/octet-stream`, `Content-Length`
        required) streamed into the **inactive** slot (FR-OTA-1). Success
        means **staged**: the confirmation window opens (~30 s, countdown
        in `/info`, accelerating amber blink on the status pixel) and only
        a **physical button press** switches the boot partition
        (FR-OTA-2). There is deliberately **no API to confirm** — staging
        and discarding are the harmless directions, which is what makes
        open CORS safe here. On expiry the image is discarded. A freshly
        booted image marks itself valid only once it serves the API;
        otherwise the bootloader reverts on the next reset (FR-OTA-6).
      parameters:
        - name: X-Image-SHA256
          in: header
          required: false
          description: |
            64 hex chars. When present, the device digests what actually
            arrived and refuses a mismatch (FR-OTA-3) — the browser checks
            the published hash before upload, this catches transit.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { $ref: "#/components/schemas/Protobuf" }
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "400": { description: "Empty body, malformed hash header, not a firmware image (magic byte checked on the first chunk), SHA-256 mismatch, or not bootable" }
        "408": { description: Upload stalled }
        "409": { description: An upload or a staged image is already in progress }
        "413": { description: Image larger than the OTA slot }
        "500": { description: Flash error }
        "503": { description: No OTA support on this build }
    delete:
      tags: [firmware]
      summary: Discard a staged image
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "404": { description: Nothing staged }
        "503": { description: No OTA support on this build }

  /api/v1/colortest:
    post:
      tags: [bench]
      summary: "Colour lab: pin one LED to exact bytes, live"
      description: |
        Body is `pinled.v1.ColorTest` (`led`, `color`, `level` 0=full,
        `gamma_x100` 0=device default, `raw` = gamma 1.0). A measurement
        instrument, not configuration: the override wins over rendering
        every frame until DELETE or reboot, and nothing persists. Added
        when "the colours are not right" needed bisection; it ended up
        convicting a driver's bit order.
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { $ref: "#/components/schemas/Protobuf" }
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "400": { description: Not a ColorTest, led/bytes/gamma out of range }
        "503": { description: No LED stack on this build }
    delete:
      tags: [bench]
      summary: Clear the colour-lab override
      responses:
        "200": { $ref: "#/components/responses/ApplyResult" }
        "503": { description: No LED stack on this build }
