<text x="52" y="690" font-size="11.5" fill="#222">Red arrows: master samples DATA just before each falling CLK edge (sample n reads line (n-1) mod 16 of module ceil(n/16)).</text>
<circle cx="34" cy="710" r="9" fill="#7b1fa2"/>
<text x="34" y="714" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="52" y="714" font-size="11.5" fill="#222">Falling edge: module k wraps 15&#8594;0 AND DONE sets (same edge). k parks at 0, its muxes release DATA.</text>
<circle cx="34" cy="734" r="9" fill="#7b1fa2"/>
<text x="34" y="738" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="52" y="738" font-size="11.5" fill="#222">First forwarded pulse is FULL WIDTH &#8212; DONE changed while CLK_IN was low, so no runt reaches module k+1.</text>
<circle cx="34" cy="758" r="9" fill="#7b1fa2"/>
<text x="34" y="762" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="52" y="762" font-size="11.5" fill="#222">Module k+1 counts on falling edges of its incoming clock &#8594; its line 0 gets a full slot before the first count.</text>
<circle cx="34" cy="782" r="9" fill="#7b1fa2"/>
<text x="34" y="786" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="52" y="786" font-size="11.5" fill="#222">Frame done: master idles CLK low.</text>
<circle cx="34" cy="806" r="9" fill="#7b1fa2"/>
<text x="34" y="810" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<text x="52" y="810" font-size="11.5" fill="#222">RC timeout (&#8805;28 &#181;s = 5&#964;): ACT falls in every module, async-clearing DONE and the counters. Chain ready for the next frame.</text>
<text x="24" y="860" font-size="13" font-weight="bold" fill="#123">Frame structure (master view)</text>
<rect x="24" y="872" width="250" height="30" fill="#fde8e6" stroke="#c0392b"/>
<text x="149.0" y="891" font-size="11" fill="#c0392b" text-anchor="middle">16 &#215; N clocks &#8212; full scan</text>
<line x1="274" y1="902" x2="424" y2="902" stroke="#666" stroke-width="2"/>
<text x="349.0" y="892" font-size="11" fill="#666" text-anchor="middle">CLK low &#8805; 28 &#181;s</text>
<rect x="424" y="872" width="250" height="30" fill="#fde8e6" stroke="#c0392b"/>
<text x="549.0" y="891" font-size="11" fill="#c0392b" text-anchor="middle">next frame &#8212; identical</text>
<line x1="674" y1="902" x2="824" y2="902" stroke="#666" stroke-width="2"/>
<text x="749.0" y="892" font-size="11" fill="#666" text-anchor="middle">CLK low &#8805; 28 &#181;s</text>
<text x="24" y="928" font-size="11" fill="#555">Constraints: CLK ~2 MHz via SPI+DMA (keeps ACT charged; &#964; = R1&#183;C1 = 12k&#8486;&#183;470pF = 5.6 &#181;s) &#183; idle gap &#8805; 5&#964; &#183; 1 k&#8486; DATA pulldown at the master &#183; LVC logic.</text>
