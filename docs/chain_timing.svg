<line x1="240" y1="84" x2="240" y2="700" stroke="#000" stroke-opacity="0.06" stroke-width="1"/>
<line x1="296" y1="84" x2="296" y2="700" stroke="#000" stroke-opacity="0.06" stroke-width="1"/>
