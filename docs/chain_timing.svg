<line x1="912" y1="84" x2="912" y2="700" stroke="#000" stroke-opacity="0.06" stroke-width="1"/>
<line x1="968" y1="84" x2="968" y2="700" stroke="#000" stroke-opacity="0.06" stroke-width="1"/>
<line x1="1024" y1="84" x2="1024" y2="700" stroke="#000" stroke-opacity="0.06" stroke-width="1"/>
<line x1="1080" y1="84" x2="1080" y2="700" stroke="#000" stroke-opacity="0.06" stroke-width="1"/>
<line x1="1136" y1="84" x2="1136" y2="700" stroke="#000" stroke-opacity="0.06" stroke-width="1"/>

<!-- /MR -->
<text x="226" y="105" font-size="11.5" fill="#222" text-anchor="end">/MR  (= SPI CS, positive)</text>
<path d="M240,112 L268,112 L268,90 L1136,90" fill="none" stroke="#7b1fa2" stroke-width="2"/>
<text x="252" y="128" font-size="10" fill="#7b1fa2" text-anchor="middle">clear</text>

<!-- CLK -->
<text x="226" y="153" font-size="11.5" fill="#222" text-anchor="end">CLK (master SCLK)</text>
