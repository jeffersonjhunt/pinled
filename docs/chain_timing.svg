<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="880" viewBox="0 0 1180 880">
<rect width="1180" height="880" fill="#fff"/>
<g font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<text x="24" y="34" font-size="20" font-weight="bold" fill="#111">PINLED rev C — 5-wire chain: arm clock, handoff, frame reset</text>
<text x="24" y="55" font-size="12" fill="#666">Counter and both '109 latches clock on FALLING edges of CLK (Schmitt-inverted) · master samples on RISING edges (SPI mode 0) · one column = half a CLK period</text>

